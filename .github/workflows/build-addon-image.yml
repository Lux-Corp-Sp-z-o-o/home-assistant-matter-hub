name: Build Add-on Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag / add-on version"
        required: true
        default: "3.0.5"
      node_version:
        description: "Node.js version for build"
        required: true
        default: "22"
      push_latest:
        description: "Also push :latest tag"
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

jobs:
  build-addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package.tgz
        run: pnpm --filter home-assistant-matter-hub... run build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push add-on image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: apps/home-assistant-matter-hub
          file: apps/home-assistant-matter-hub/addon.Dockerfile
          build-args: |
            NODE_VERSION=${{ inputs.node_version }}
            PACKAGE_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/lux-corp-sp-z-o-o/home-assistant-matter-hub-addon:${{ inputs.version }}
            ${{ inputs.push_latest == 'true' && 'ghcr.io/lux-corp-sp-z-o-o/home-assistant-matter-hub-addon:latest' || '' }}
